<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Estoque TI - Sincronizado</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- Módulos do Firebase Firestore -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Sua Configuração Oficial do Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyBEEpwCJg4aU1-HG52TRoKqkYnDDyg8YpY",
      authDomain: "inventario-ativos-32310.firebaseapp.com",
      projectId: "inventario-ativos-32310",
      storageBucket: "inventario-ativos-32310.firebasestorage.app",
      messagingSenderId: "1052155698576",
      appId: "1:1052155698576:web:cc411272b6efd369d2a715"
    };

    // Inicializa Firebase e Firestore
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const inventarioRef = collection(db, "inventario");

    window.db = db;
    window.inventarioRef = inventarioRef;
    window.addDoc = addDoc;
    window.deleteDoc = deleteDoc;
    window.doc = doc;

    // Escuta em TEMPO REAL as alterações na nuvem
    const q = query(inventarioRef, orderBy("timestamp", "desc"));
    onSnapshot(q, (snapshot) => {
      window.lancamentos = [];
      snapshot.forEach((doc) => {
        window.lancamentos.push({ id: doc.id, ...doc.data() });
      });
      window.atualizarResumo();
    }, (error) => {
      console.error("Erro ao sincronizar com Firestore:", error);
      const statusEl = document.getElementById('statusNuvem');
      if (statusEl) {
        statusEl.className = "bg-red-50 border border-red-200 p-2.5 rounded-xl text-xs text-red-800 font-medium";
        statusEl.innerHTML = "⚠️ Erro de permissão no Firestore. Verifique se ativou o Modo de Teste nas regras!";
      }
    });
  </script>
</head>

      </div>

  <main class="max-w-md mx-auto p-4 space-y-4">

        <div class="bg-amber-50 border border-amber-200 p-3 rounded-lg">

            <div>
              <span class="text-xs font-bold text-amber-900 block">MS-SP (Formatado / Sem Imagem)</span>
              <span class="text-[10px] text-amber-700 block">Marque se
