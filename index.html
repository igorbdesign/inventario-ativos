<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coletor de Estoque - Almoxarifado</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-12">

  <!-- Cabeçalho -->
  <header class="bg-indigo-700 text-white p-4 shadow-md sticky top-0 z-10">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-base font-bold">📦 Coletor de Almoxarifado</h1>
        <p class="text-[10px] text-indigo-200">Modo Seguro (Offline/Local)</p>
      </div>
      <span id="totalContado" class="bg-indigo-900 text-white text-xs px-2.5 py-1 rounded-full font-bold">Total: 0</span>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- Status -->
    <section id="statusMsg" class="bg-emerald-50 border border-emerald-200 p-2.5 rounded-xl text-xs text-emerald-800 font-semibold">
      ✅ Sistema pronto e salvando automaticamente no aparelho!
    </section>

    <!-- 1. Categoria do Item -->
    <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">1. Categoria</h2>
      
      <div class="grid grid-cols-3 gap-2">
        <button onclick="selecionarCategoria('notebook')" id="btnCatNotebook" class="cat-btn bg-indigo-50 border-2 border-indigo-600 text-indigo-800 p-2.5 rounded-xl font-bold text-xs text-center flex flex-col items-center justify-center gap-1 transition">
          <span class="text-lg">💻</span> Notebooks
        </button>
        <button onclick="selecionarCategoria('ativo')" id="btnCatAtivo" class="cat-btn bg-slate-50 border border-slate-200 text-slate-600 p-2.5 rounded-xl font-semibold text-xs text-center flex flex-col items-center justify-center gap-1 transition">
          <span class="text-lg">📱</span> Ativos
        </button>
        <button onclick="selecionarCategoria('periferico')" id="btnCatPeriferico" class="cat-btn bg-slate-50 border border-slate-200 text-slate-600 p-2.5 rounded-xl font-semibold text-xs text-center flex flex-col items-center justify-center gap-1 transition">
          <span class="text-lg">🎧</span> Periféricos
        </button>
      </div>
    </section>

    <!-- 2. Formulário -->
    <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-4">
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">2. Lançamento</h2>

      <div>
        <label for="modeloSelect" class="block text-xs font-medium text-slate-700 mb-1">Modelo / Item</label>
        <select id="modeloSelect" class="w-full p-2.5 border border-slate-300 rounded-lg bg-white text-sm font-medium focus:ring-2 focus:ring-indigo-500">
          <option value="">Carregando catálogo...</option>
        </select>
      </div>

      <!-- PAINEL NOTEBOOKS E ATIVOS -->
      <div id="painelAtivos" class="space-y-3">
        <div>
          <span class="block text-xs font-medium text-slate-700 mb-1">Estado do Equipamento</span>
          <div class="grid grid-cols-2 gap-2">
            <label for="radioBom" class="flex items-center gap-2 p-2.5 border rounded-lg bg-slate-50 cursor-pointer">
              <input type="radio" id="radioBom" name="estadoAtivo" value="BOM" checked class="text-indigo-600">
              <span class="text-xs font-bold text-emerald-700">✓ Bom Estado</span>
            </label>
            <label for="radioRuim" class="flex items-center gap-2 p-2.5 border rounded-lg bg-slate-50 cursor-pointer">
              <input type="radio" id="radioRuim" name="estadoAtivo" value="RUIM" class="text-indigo-600">
              <span class="text-xs font-bold text-red-600">✕ Defeito / Ruim</span>
            </label>
          </div>
        </div>

        <div class="bg-amber-50 border border-amber-200 p-3 rounded-lg">
          <label for="chkMsSp" class="flex items-center gap-2.5 cursor-pointer">
            <input type="checkbox" id="chkMsSp" class="w-4 h-4 text-amber-600 rounded">
            <div>
              <span class="text-xs font-bold text-amber-900 block">MS-SP (Formatado / Sem Imagem)</span>
              <span class="text-[10px] text-amber-700 block">Marque se estiver formatado sem imagem</span>
            </div>
          </label>
        </div>

        <div>
          <label for="qtdAtivoInput" class="block text-xs font-medium text-slate-700 mb-1">Quantidade</label>
          <input type="number" id="qtdAtivoInput" value="1" min="1" class="w-full p-2.5 border border-slate-300 rounded-lg text-base font-bold text-indigo-700 text-center" />
        </div>
      </div>

      <!-- PAINEL PERIFÉRICOS -->
      <div id="painelPerifericos" class="hidden space-y-3">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label for="qtdBoaInput" class="block text-xs font-bold text-emerald-700 mb-1">Qtd Boas (OK)</label>
            <input type="number" id="qtdBoaInput" value="0" min="0" class="w-full p-2.5 border border-emerald-300 bg-emerald-50 rounded-lg text-base font-bold text-emerald-800 text-center focus:ring-2 focus:ring-emerald-500" />
          </div>
          <div>
            <label for="qtdRuimInput" class="block text-xs font-bold text-red-600 mb-1">Qtd Ruins (Defeito)</label>
            <input type="number" id="qtdRuimInput" value="0" min="0" class="w-full p-2.5 border border-red-300 bg-red-50 rounded-lg text-base font-bold text-red-700 text-center focus:ring-2 focus:ring-red-500" />
          </div>
        </div>
      </div>

      <div>
        <label for="obsInput" class="block text-xs font-medium text-slate-700 mb-1">Observação (Opcional)</label>
        <input type="text" id="obsInput" placeholder="Ex: teclado ruim, tela quebrada..." class="w-full p-2.5 border border-slate-300 rounded-lg text-sm" />
      </div>

      <button onclick="salvarLancamento()" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold text-sm shadow-md hover:bg-emerald-700 transition">
        + Adicionar ao Estoque
      </button>
    </section>

    <!-- 3. Resumo da Contagem -->
    <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">3. Itens Contados</h2>
      <div id="resumoContainer" class="text-xs space-y-2 max-h-56 overflow-y-auto bg-slate-50 p-2.5 rounded-lg border border-slate-200">
        <p class="text-slate-400 italic text-center py-2">Nenhum item adicionado ainda.</p>
      </div>
    </section>

    <!-- 4. Exportar e Ações -->
    <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-2">
      <button onclick="exportarExcel()" class="w-full bg-slate-900 text-white py-3 rounded-xl font-bold text-sm shadow hover:bg-black transition flex items-center justify-center gap-2">
        📥 Exportar Relatório Excel (.xlsx)
      </button>
      <button onclick="limparTudo()" class="w-full bg-red-50 text-red-600 border border-red-200 py-2 rounded-xl font-semibold text-xs transition hover:bg-red-100">
        🗑️ Limpar Todos os Registros
      </button>
    </section>

  </main>

  <script>
    let CATALOGO_GLOBAL = { notebooks: [], ativos: [], perifericos: [] };
    let categoriaAtual = 'notebook';
    let lancamentos = [];

    // Carrega dados salvos no aparelho ao iniciar
    function carregarDadosSalvos() {
      const salvo = localStorage.getItem('inventario_almoxarifado');
      if (salvo) {
        try {
          lancamentos = JSON.parse(salvo);
        } catch(e) {
          lancamentos = [];
        }
      }
      atualizarResumo();
    }

    // Salva permanentemente no aparelho
    function persistirDados() {
      localStorage.setItem('inventario_almoxarifado', JSON.stringify(lancamentos));
      atualizarResumo();
    }

    async function carregarCatalogo() {
      try {
        const response = await fetch('./produtos.json?t=' + new Date().getTime());
        if (!response.ok) throw new Error('produtos.json não encontrado');
        
        const listaProdutos = await response.json();

        let notebookSet = new Set();
        let ativoSet = new Set();
        let perifericoSet = new Set();

        listaProdutos.forEach(nomeProd => {
          let limpo = String(nomeProd).replace(/ - (Defeito\/Manutenção|MS-SP.*)/g, '').trim();
          const lower = limpo.toLowerCase();

          if (lower.includes('notebook')) {
            notebookSet.add(limpo);
          } else if (lower.includes('celular') || lower.includes('monitor') || lower.includes('tablet') || lower.includes('dockstation')) {
            ativoSet.add(limpo);
          } else {
            perifericoSet.add(limpo);
          }
        });

        CATALOGO_GLOBAL.notebooks = Array.from(notebookSet).sort();
        CATALOGO_GLOBAL.ativos = Array.from(ativoSet).sort();
        CATALOGO_GLOBAL.perifericos = Array.from(perifericoSet).sort();

        selecionarCategoria(categoriaAtual);
      } catch (err) {
        console.warn('Aviso ao carregar catálogo:', err);
      }
    }

    function selecionarCategoria(cat) {
      categoriaAtual = cat;

      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.className = "cat-btn bg-slate-50 border border-slate-200 text-slate-600 p-2.5 rounded-xl font-semibold text-xs text-center flex flex-col items-center justify-center gap-1 transition";
      });

      const btnAtivo = document.getElementById(cat === 'notebook' ? 'btnCatNotebook' : (cat === 'ativo' ? 'btnCatAtivo' : 'btnCatPeriferico'));
      if (btnAtivo) {
        btnAtivo.className = "cat-btn bg-indigo-50 border-2 border-indigo-600 text-indigo-800 p-2.5 rounded-xl font-bold text-xs text-center flex flex-col items-center justify-center gap-1 transition";
      }

      const select = document.getElementById('modeloSelect');
      if (!select) return;
      select.innerHTML = '';
      
      const lista = CATALOGO_GLOBAL[cat === 'notebook' ? 'notebooks' : (cat === 'ativo' ? 'ativos' : 'perifericos')];

      if (lista.length === 0) {
        select.innerHTML = '<option value="">Nenhum item carregado</option>';
      } else {
        lista.forEach(item => {
          const opt = document.createElement('option');
          opt.value = item;
          opt.textContent = item;
          select.appendChild(opt);
        });
      }

      const painelAtivos = document.getElementById('painelAtivos');
      const painelPerifericos = document.getElementById('painelPerifericos');

      if (cat === 'periferico') {
        painelAtivos.classList.add('hidden');
        painelPerifericos.classList.remove('hidden');
      } else {
        painelAtivos.classList.remove('hidden');
        painelPerifericos.classList.add('hidden');
      }
    }

    function salvarLancamento() {
      const modeloSelect = document.getElementById('modeloSelect');
      if (!modeloSelect) return;
      const modeloBase = modeloSelect.value;
      
      if (!modeloBase) {
        alert('Selecione um modelo válido!');
        return;
      }
      const obs = document.getElementById('obsInput').value.trim();

      if (categoriaAtual === 'periferico') {
        const qtdBoa = parseInt(document.getElementById('qtdBoaInput').value) || 0;
        const qtdRuim = parseInt(document.getElementById('qtdRuimInput').value) || 0;

        if (qtdBoa === 0 && qtdRuim === 0) {
          alert('Informe a quantidade Boa ou Ruim!');
          return;
        }

        if (qtdBoa > 0) {
          lancamentos.push({
            id: '_' + Math.random().toString(36).substr(2, 9),
            Produto: modeloBase,
            Quantidade: qtdBoa,
            Estado: 'Bom Estado (OK)',
            Categoria: 'Periférico',
            Observacao: obs,
            Data_Hora: new Date().toLocaleString('pt-BR')
          });
        }

        if (qtdRuim > 0) {
          lancamentos.push({
            id: '_' + Math.random().toString(36).substr(2, 9),
            Produto: `${modeloBase} - Defeito/Manutenção`,
            Quantidade: qtdRuim,
            Estado: 'Defeito / Manutenção',
            Categoria: 'Periférico',
            Observacao: obs,
            Data_Hora: new Date().toLocaleString('pt-BR')
          });
        }

        document.getElementById('qtdBoaInput').value = '0';
        document.getElementById('qtdRuimInput').value = '0';

      } else {
        const estadoEl = document.querySelector('input[name="estadoAtivo"]:checked');
        const estado = estadoEl ? estadoEl.value : 'BOM';
        const isMsSp = document.getElementById('chkMsSp').checked;
        const qtd = parseInt(document.getElementById('qtdAtivoInput').value) || 1;

        let nomeFormatado = modeloBase;

        if (isMsSp) {
          nomeFormatado += ' - MS-SP';
        }

        if (estado === 'RUIM') {
          nomeFormatado += ' - Defeito/Manutenção';
        }

        lancamentos.push({
          id: '_' + Math.random().toString(36).substr(2, 9),
          Produto: nomeFormatado,
          Quantidade: qtd,
          Estado: estado === 'BOM' ? 'Bom Estado (OK)' : 'Defeito / Manutenção',
          Categoria: categoriaAtual === 'notebook' ? 'Notebook' : 'Ativo',
          Observacao: obs,
          Data_Hora: new Date().toLocaleString('pt-BR')
        });

        document.getElementById('qtdAtivoInput').value = '1';
        document.getElementById('chkMsSp').checked = false;
      }

      document.getElementById('obsInput').value = '';
      persistirDados();
    }

    function atualizarResumo() {
      const totalItens = lancamentos.reduce((acc, curr) => acc + curr.Quantidade, 0);
      const totalEl = document.getElementById('totalContado');
      if (totalEl) totalEl.innerText = `Total: ${totalItens}`;

      const resContainer = document.getElementById('resumoContainer');
      if (!resContainer) return;
      resContainer.innerHTML = '';

      if (lancamentos.length === 0) {
        resContainer.innerHTML = '<p class="text-slate-400 italic text-center py-2">Nenhum item adicionado ainda.</p>';
        return;
      }

      lancamentos.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = "flex justify-between items-center bg-white p-2.5 rounded-lg border border-slate-200 shadow-sm";
        div.innerHTML = `
          <div>
            <span class="font-bold text-slate-800 text-xs block">${item.Produto}</span>
            <span class="text-[10px] text-slate-500">${item.Categoria} | Qtd: <b class="text-indigo-600">${item.Quantidade}</b> ${item.Observacao ? ' | Obs: ' + item.Observacao : ''}</span>
          </div>
          <button onclick="removerItem(${index})" class="text-red-500 font-bold px-2 py-1 text-xs hover:bg-red-50 rounded" title="Excluir">✕</button>
        `;
        resContainer.appendChild(div);
      });
    }

    function removerItem(index) {
      if (confirm('Deseja remover este item?')) {
        lancamentos.splice(index, 1);
        persistirDados();
      }
    }

    function limparTudo() {
      if (confirm('Tem certeza que deseja apagar todos os registros da contagem atual?')) {
        lancamentos = [];
        persistirDados();
      }
    }

    function exportarExcel() {
      if (lancamentos.length === 0) {
        alert('Nenhum dado para exportar!');
        return;
      }

      const dadosExport = lancamentos.map(item => ({
        "Produto / Identificação": item.Produto,
        "Quantidade": item.Quantidade,
        "Estado": item.Estado,
        "Categoria": item.Categoria,
        "Observação": item.Observacao,
        "Data e Hora": item.Data_Hora
      }));

      const worksheet = XLSX.utils.json_to_sheet(dadosExport);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Inventario_Almox");

      const dataAtual = new Date().toISOString().slice(0, 10);
      XLSX.writeFile(workbook, `Inventario_Estoque_${dataAtual}.xlsx`);
    }

    // Inicialização
    carregarDadosSalvos();
    carregarCatalogo();
  </script>
</body>
</html>
