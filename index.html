<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventário de Ativos - Triage Mobile</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS (XLSX) CDN -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased pb-20">

    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-30">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="font-bold text-lg">Inventário & Triage</h1>
            <span id="total-loaded" class="text-xs bg-indigo-800 px-2.5 py-1 rounded-full font-medium">0 ativos carregados</span>
        </div>
    </header>

    <!-- Navigation Tabs (Fixas e sempre clicáveis) -->
    <nav class="bg-white shadow-sm border-b sticky top-[52px] z-30">
        <div class="max-w-md mx-auto flex justify-around">
            <button type="button" onclick="switchTab('triage')" id="tab-triage" class="flex-1 py-3 text-center font-semibold text-indigo-600 border-b-2 border-indigo-600 text-sm">Triage</button>
            <button type="button" onclick="switchTab('database')" id="tab-database" class="flex-1 py-3 text-center font-medium text-slate-500 border-b-2 border-transparent text-sm">Bases</button>
            <button type="button" onclick="switchTab('audited')" id="tab-audited" class="flex-1 py-3 text-center font-medium text-slate-500 border-b-2 border-transparent text-sm">Auditados (<span id="audit-count">0</span>)</button>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="max-w-md mx-auto p-4">

        <!-- TAB 1: TRIAGE -->
        <section id="content-triage" class="space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 relative">
                <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Buscar Ativo (Nome, Ativo ou SN)</label>
                <div class="relative">
                    <input type="text" id="search-input" autocomplete="off" placeholder="Digite nome, ativo ou SN..." class="w-full p-3 border rounded-lg bg-slate-50 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <!-- Dropdown suggestions -->
                <div id="suggestions-box" class="hidden mt-1 max-h-56 overflow-y-auto bg-white border border-slate-200 rounded-lg shadow-xl absolute left-0 right-0 z-20 divide-y divide-slate-100"></div>
            </div>

            <!-- Formulário de Triage -->
            <form id="triage-form" onsubmit="saveAudit(event)" class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-4">
                <h2 class="font-semibold text-slate-700 border-b pb-2 text-sm flex justify-between items-center">
                    <span>Dados do Equipamento</span>
                    <span id="asset-cat" class="text-xs px-2 py-0.5 bg-slate-100 text-slate-600 rounded"></span>
                </h2>

                <!-- Campos Read-Only -->
                <div class="grid grid-cols-2 gap-3 text-xs">
                    <div>
                        <span class="text-slate-400 block">Nome:</span>
                        <input type="text" id="f-nome" readonly class="w-full bg-slate-100 p-2 rounded border text-slate-600 font-medium">
                    </div>
                    <div>
                        <span class="text-slate-400 block">Nº Ativo / Inv:</span>
                        <input type="text" id="f-ativo" readonly class="w-full bg-slate-100 p-2 rounded border text-slate-600 font-medium">
                    </div>
                    <div>
                        <span class="text-slate-400 block">Serial Number (SN):</span>
                        <input type="text" id="f-sn" readonly class="w-full bg-slate-100 p-2 rounded border text-slate-600 font-medium">
                    </div>
                    <div>
                        <span class="text-slate-400 block">Modelo:</span>
                        <input type="text" id="f-modelo" readonly class="w-full bg-slate-100 p-2 rounded border text-slate-600 font-medium">
                    </div>
                    <div>
                        <span class="text-slate-400 block">Localização:</span>
                        <input type="text" id="f-local" readonly class="w-full bg-slate-100 p-2 rounded border text-slate-600 font-medium">
                    </div>
                    <div>
                        <span class="text-slate-400 block">Usuário Original:</span>
                        <input type="text" id="f-usuario" readonly class="w-full bg-slate-100 p-2 rounded border text-slate-600 font-medium">
                    </div>
                </div>

                <hr class="border-slate-100">

                <!-- Campos de Triage (Editáveis) -->
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Condição Física/Funcional *</label>
                        <select id="f-condicao" required class="w-full p-2.5 bg-white border rounded-lg text-sm font-medium focus:ring-2 focus:ring-indigo-500">
                            <option value="">Selecione a condição...</option>
                            <option value="Bom / Perfeito">Bom / Perfeito</option>
                            <option value="Funcionando com Rest
